<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Neon Pac-Man</title></head>
  <body>
    <main id="game-shell">
      <header><div><span class="eyebrow">ARCADE // 1980</span><h1>NEON PAC-MAN</h1></div><div class="stats"><span>SCORE <b id="score">000000</b></span><span>HIGH <b id="high-score">000000</b></span><span>LIVES <b id="lives">●●●</b></span></div></header>
      <section id="viewport" aria-label="Three dimensional Pac-Man game"><div id="message"><h2 id="message-title">READY!</h2><p id="message-copy">Arrow keys / WASD to move</p><button id="start-button">START GAME</button></div></section>
      <footer><span id="status">INSERT COIN // PRESS START</span><span>POWER PELLETS // GHOSTS // HIGH SCORE</span></footer>
    </main>
    <script type="module" src="/game.js"></script>
  </body>
</html>
