# Lwa MCP model-routing baseline.
# Model catalogs and prices change. Seed models make the router usable immediately;
# live discovery supplements them whenever a provider exposes a compatible /models API.
consent_mode: paid_only       # always_ask | paid_only | automatic
prefer_free: true
allow_user_pays: false
allow_paid: false
dashboard_host: 127.0.0.1
dashboard_port: 8766
catalog_refresh_minutes: 30
confirmation_ttl_seconds: 600
max_parallel_consensus: 3

# Persistent cross-project tool library and repetition detector.
auto_detect_patterns: true
pattern_min_occurrences: 3
pattern_similarity_threshold: 0.68
auto_create_library_tools: true
auto_activate_prompt_tools: true
suggest_library_tools: true
max_library_suggestions: 5
allow_reviewed_script_execution: false
post_response_tier_guidance: true
post_response_tier_guidance_mode: codex_request

providers:
  gemini:
    name: gemini
    adapter: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    # Optional key pool: first configured key is used for generation.
    api_key_envs: [GEMINI_API_KEY_1, GEMINI_API_KEY_2]
    # Optional separate key used only for quota/billing probes.
    billing_api_key_env: GEMINI_BILLING_API_KEY
    billing_class: free_quota
    subscription_plan: Gemini Pro
    subscription_status: unknown   # active | inactive | expired | unknown
    subscription_monthly_token_limit: null
    daily_request_cap: 900
  openai:
    name: openai
    adapter: openai_media
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    api_key_envs: [OPENAI_API_KEY_1]
    billing_api_key_env: OPENAI_BILLING_API_KEY
    billing_class: paid
    subscription_plan: ChatGPT Plus
    subscription_status: unknown
    monthly_usd_cap: 5.00
  openrouter:
    name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    billing_class: free_quota
    quota_path: /auth/key
    daily_request_cap: 45
  groq:
    name: groq
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    billing_class: free_quota
    daily_request_cap: 900
  mistral:
    name: mistral
    base_url: https://api.mistral.ai/v1
    api_key_env: MISTRAL_API_KEY
    billing_class: free_quota
    daily_request_cap: 900
  cloudflare:
    name: cloudflare
    base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    api_key_env: CLOUDFLARE_API_TOKEN
    account_id_env: CLOUDFLARE_ACCOUNT_ID
    billing_class: free_quota
    supports_live_models: false
    daily_request_cap: 900
  siliconflow:
    name: siliconflow
    enabled: false
    experimental: true
    disabled_reason: "Experimental provider disabled by default: last live model discovery returned HTTP 401; verify SILICONFLOW_API_KEY before re-enabling."
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    billing_class: free_quota
    daily_request_cap: 900
  venice:
    name: venice
    base_url: https://api.venice.ai/api/v1
    api_key_env: VENICE_API_KEY
    quota_path: /billing/balance
    billing_class: paid
    monthly_usd_cap: 5.00
  pollinations:
    name: pollinations
    base_url: https://gen.pollinations.ai/v1
    api_key_env: POLLINATIONS_API_KEY
    billing_class: free_quota
    daily_request_cap: 900
  cohere:
    name: cohere
    base_url: https://api.cohere.ai/compatibility/v1
    api_key_env: COHERE_API_KEY
    billing_class: free_quota
    daily_request_cap: 900
  replicate:
    name: replicate
    adapter: replicate
    api_key_env: REPLICATE_API_TOKEN
    billing_class: paid
    supports_live_models: false
    monthly_usd_cap: 5.00
  stability:
    name: stability
    adapter: stability
    base_url: https://api.stability.ai
    api_key_env: STABILITY_API_KEY
    billing_class: paid
    supports_live_models: false
    monthly_usd_cap: 5.00
  nvidia:
    name: nvidia
    base_url: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    billing_class: free_quota
    daily_request_cap: 900
  zai:
    name: zai
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
    billing_class: free_quota
    daily_request_cap: 900
  aion:
    name: aion
    base_url: https://api.aionlabs.ai/v1
    api_key_env: AION_API_KEY
    billing_class: free_quota
    daily_request_cap: 900
  zenmux:
    name: zenmux
    base_url: https://zenmux.ai/api/v1
    api_key_env: ZENMUX_API_KEY
    quota_path: /management/payg/balance
    quota_key_env: ZENMUX_MANAGEMENT_API_KEY
    billing_class: paid
    monthly_usd_cap: 5.00
  cerebras:
    name: cerebras
    base_url: https://api.cerebras.ai/v1
    api_key_env: CEREBRAS_API_KEY
    billing_class: free_quota
    daily_request_cap: 900
  blackbox:
    name: blackbox
    base_url: https://api.blackbox.ai
    api_key_env: BLACKBOX_API_KEY
    chat_path: /chat/completions
    supports_live_models: false
    billing_class: paid
    monthly_usd_cap: 5.00
  puter:
    name: puter
    adapter: puter
    base_url: https://api.puter.com/puterai/openai/v1
    api_key_env: PUTER_AUTH_TOKEN
    billing_class: user_pays
    daily_request_cap: 900

# Scores are 0-100 task affinity values. Exact model availability is validated at runtime.
# Unknown live models remain eligible at a neutral score, but these seeds win normal routing.
models:
  - provider: gemini
    model: gemini-2.5-flash
    display_name: Gemini 2.5 Flash
    billing_class: free_quota
    context_length: 1048576
    # Operator-declared quota metadata; live APIs usually do not expose plan limits.
    free_plan_max_tokens: null
    pro_plan_max_tokens: null
    capabilities: [text, reasoning, vision]
